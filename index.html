<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AYAH — Premium Tech</title>
    <meta name="description" content="AYAH — premium technology products. Browse the catalog, save favorites and order instantly via WhatsApp." />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070D" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6FA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AYAH" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <meta property="og:title" content="AYAH — Premium Tech" />
    <meta property="og:description" content="Premium technology products. Browse, discover and order via WhatsApp." />
    <script>
      try {
        var t = localStorage.getItem('ayah-theme')
        var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
